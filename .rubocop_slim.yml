# .rubocop_slim.yml

inherit_from: .rubocop.yml

# Специальные правила для Slim файлов
AllCops:
  Exclude:
    - 'node_modules/**/*'
    - 'vendor/**/*'

# Отключаем проверки, которые мешают в Slim
Layout/ArgumentAlignment:
  Enabled: false

Layout/FirstHashElementIndentation:
  Enabled: false

Layout/HashAlignment:
  Enabled: false

Layout/LineLength:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false
  