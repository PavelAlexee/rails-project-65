# .rubocop.yml

AllCops:
  NewCops: disable
  TargetRubyVersion: 3.0
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
    - 'bin/**/*'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'storage/**/*'

# Настройка кавычек
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes
  
Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: single_quotes

# Отключаем проблемные копы
Layout/LineLength:
  Enabled: false
  
Style/Documentation:
  Enabled: false
  
Metrics/MethodLength:
  Enabled: false
  
Metrics/AbcSize:
  Enabled: false
  